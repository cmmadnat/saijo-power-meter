# The secrets provider must be committed. `pulumi stack init --secrets-provider`
# writes this key into the stack file on whatever machine ran it, and in CI that
# file is thrown away with the runner — every later run then falls back to the
# passphrase provider and fails. Pinning it here is what makes the stack
# reproducible from a fresh checkout.
#
# Pinning the KMS key does pin the project, unlike the config below. That is the
# cost of the state being reproducible, and it is the same trade Pulumi makes by
# committing Pulumi.<stack>.yaml at all.
secretsprovider: gcpkms://projects/saijo-power-meter/locations/asia-southeast1/keyRings/pulumi/cryptoKeys/state

config:
  gcp:region: asia-southeast1
  # The GCP project is deliberately not pinned here. CI supplies it as
  # GOOGLE_PROJECT (from the GCP_PROJECT_ID repository variable), so the same
  # program can target another project without editing this file.
  gcp:disableGlobalProjectWarning: "true"
  # Which repository's Actions runs may impersonate the log-reader service
  # account, and the Workload Identity Federation pool holding the provider that
  # mints their tokens. Both match bootstrap.sh (GITHUB_REPO and POOL_ID); the
  # program falls back to these same values if a new stack omits them.
  saijo-power-meter:githubRepository: cmmadnat/saijo-power-meter
  saijo-power-meter:wifPoolId: github
  # Who gets an email when a Cloud Build run fails. Nothing reports a build
  # result back to GitHub — a webhook trigger posts no check and no status — so
  # with this unset a broken deploy is announced nowhere at all.
  #
  # Cloud Monitoring sends a confirmation to a new email channel, and the
  # channel stays unverified until that link is clicked. An unverified channel
  # is created happily and delivers nothing, so the first alert is the wrong
  # time to find out.
  saijo-power-meter:alertEmail: cmmadnat@gmail.com
  # Whether the MQTT ingester's Cloud Run service is deployed. True since
  # step 9, in observe mode: ingesterMode defaults to "observe" in index.ts,
  # which runs WAREHOUSE=none on the client id power-meter-observer — the
  # customer's broker read into memory and served over HTTP, nothing written to
  # BigQuery or Firestore.
  #
  # Turning it on also declares the three mqtt-broker-* secrets' first versions,
  # read from `reference doc/mqtt` at apply time — values the customer already
  # committed. See brokerSecretValues in index.ts, and rotate before go-live.
  #
  # "record" (saijo-power-meter:ingesterMode) is go-live: the same change that
  # confirms the divisors in packages/infrastructure/src/mqtt/scaling.ts,
  # rotates the credentials and resets the warehouse. A recording revision
  # refuses to start while the divisors are guesses.
  saijo-power-meter:deployIngester: "true"
  # The web app's data mode: "demo" (fixtures, badged on every screen) or
  # "live" (the ingester's hot state and the warehouse). Demo until the same
  # change that flips deployIngester above: the program refuses "live" without
  # the ingester, and the app refuses to boot in live mode while a scale divisor
  # is still a guess. See apps/web/lib/data-mode.ts.
  saijo-power-meter:dataMode: "demo"
