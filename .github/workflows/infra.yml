name: infra

# Pulumi runs here and nowhere else: this is the only place holding an identity
# that can change Google Cloud. Pull requests get a preview, main gets applied.
#
# This workflow also builds and pushes the web image, because the two cannot be
# separated: Cloud Run will not accept a reference to an image that does not
# exist, so the push has to happen before `pulumi up` in the same run.
on:
  pull_request:
    paths: &deploy_paths
      - "infra/**"
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/infra.yml"
  push:
    branches: [main]
    paths: *deploy_paths

concurrency:
  # Repo-wide, deliberately NOT keyed on the ref. Every run — preview or apply —
  # touches the same stack state object in GCS, so a pull request run and a main
  # run must never overlap. Keying this per-ref let exactly that happen and the
  # second run died on the first one's lock.
  group: infra
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write        # required to mint the OIDC token for WIF
  pull-requests: write   # required to post the preview comment

jobs:
  pulumi:
    runs-on: ubuntu-latest
    env:
      GOOGLE_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      PULUMI_BACKEND_URL: gs://${{ vars.GCP_STATE_BUCKET }}
      # Pinned to the commit, never :latest. Cloud Run only creates a new
      # revision when the image reference changes, so a floating tag would leave
      # the service on its old revision and the deploy would quietly do nothing.
      WEB_IMAGE: asia-southeast1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/app/web:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      # Keyless: exchanges the job's OIDC token for short-lived credentials.
      # No service account key exists to leak.
      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Authenticate Docker to Artifact Registry
        run: gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      # Built on every run so a pull request catches a broken Dockerfile, but
      # only pushed on main: a pull request's image would never be deployed and
      # would just accumulate in the registry.
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          # The repository root, not apps/web: the app imports the workspace
          # packages and npm hoists the dependency tree to the root, so neither
          # is reachable from inside apps/web.
          context: .
          file: apps/web/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.WEB_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - run: npm ci
        working-directory: infra

      - name: Install Pulumi CLI
        run: |
          curl -fsSL https://get.pulumi.com | sh
          echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"

      # Create the stack if it does not exist yet. Existence is checked with
      # `stack ls`, which is read-only: `stack select` on a missing stack takes a
      # lock in the state bucket and abandons it on failure, so the `stack init`
      # that followed tripped over a lock its own predecessor had left behind.
      # pulumi/actions selects the stack itself, so nothing selects it here.
      - name: Create stack if missing
        working-directory: infra
        run: |
          pulumi login
          if pulumi stack ls --json | jq -e '.[] | select(.name == "dev")' >/dev/null 2>&1; then
            echo "Stack 'dev' already exists."
          else
            echo "Stack 'dev' not found — creating it."
            pulumi stack init dev --secrets-provider "gcpkms://${{ vars.GCP_KMS_KEY }}"
          fi

      - uses: pulumi/actions@v6
        with:
          command: ${{ github.event_name == 'push' && 'up' || 'preview' }}
          stack-name: dev
          work-dir: infra
          # Stated explicitly: without it the action announces "Logging into the
          # Pulumi Cloud backend", which is at best confusing when state lives in
          # a bucket we own.
          cloud-url: gs://${{ vars.GCP_STATE_BUCKET }}
          comment-on-pr: true
          diff: true

      - name: Show the deployed URL
        if: github.event_name == 'push'
        working-directory: infra
        # Read-only, and addressed with --stack rather than `stack select` so
        # nothing here touches a lock in the state bucket after the apply.
        run: |
          {
            echo "### Deployed"
            echo "$(pulumi stack output webUrl --stack dev)"
          } >> "$GITHUB_STEP_SUMMARY"
