# Quarkus Configuration
quarkus.http.port=8080
quarkus.log.level=INFO
quarkus.log.console.enable=true

# Firebase Configuration
firebase.project.id=saijo-monitoring
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:}

# Development Profile - Use Firebase Emulator
%dev.firebase.emulator.enabled=true
%dev.firebase.emulator.host=localhost
%dev.firebase.emulator.port=8089
%dev.firebase.project.id=demo-project

# Production Profile - Firebase enabled with Application Default Credentials  
%prod.firebase.project.id=saijo-monitoring

# Test Profile Configuration
%test.firebase.credentials.path=test-credentials.json
%test.firebase.project.id=test-project

# Health Check Configuration
quarkus.smallrye-health.ui.always-include=true

# CORS Configuration for development
quarkus.http.cors=true
quarkus.http.cors.origins=*

# Swagger UI Configuration - Enable in production
quarkus.swagger-ui.always-include=true

# Static Resources Configuration - Serve frontend from /app/static
# Note: Quarkus static resources expect files in src/main/resources/META-INF/resources/
# The Docker approach needs different handling - use a resource handler instead